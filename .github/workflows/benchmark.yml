name: Benchmark

on:
  pull_request:
    branches: [master]
    paths: ['*.go', 'go.mod']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  BENCH_COUNT: 10

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build benchmarks
        run: |
          go test -c -o after.test .
          git fetch --quiet origin master ${{ github.event.pull_request.base.sha }}
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          go test -c -o before.test .
          git checkout --quiet ${{ github.sha }}

      - name: Run benchmarks
        run: |
          for _ in $(seq ${{ env.BENCH_COUNT }}); do
            ./after.test -test.run='^$' -test.bench=. -test.benchmem -test.benchtime=100ms | tee -a after
            ./before.test -test.run='^$' -test.bench=. -test.benchmem -test.benchtime=100ms | tee -a before
          done

      - name: Compare benchmarks
        id: bench
        env:
          GOTOOLCHAIN: auto
        run: |
          go run golang.org/x/perf/cmd/benchstat@latest before after | tee diff
          printf 'diff<<EOF\n%s\nEOF\n' "$(cat diff)" >> $GITHUB_OUTPUT

      - name: Create comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchmarks
          message: |
            ### Benchmark Results
            ```
            ${{ steps.bench.outputs.diff }}
            ```
